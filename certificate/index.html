<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Typing Certificate | Idrees Typing Academy</title><link rel="stylesheet" href="/theme.css"><style>body{background:#f7f1fa;padding:25px}.wrap{max-width:900px;margin:30px auto;text-align:center}.cert{background:white;padding:50px 30px;border:12px double #9836ad;outline:2px solid #d6ad52;outline-offset:6px}.cert h1{font:40px Georgia,serif;color:#301342}.name{font:italic 32px Georgia,serif;color:#bf3c72;border-bottom:1px solid #ddd;padding:12px}.meta{display:flex;justify-content:center;gap:25px;flex-wrap:wrap;margin:25px}.meta b{display:block;font-size:22px;color:#77318e}@media print{body{background:white;padding:0}.wrap{margin:0}.actions{display:none}}</style></head><body><main class="wrap"><section class="cert" id="cert"><p>✦ IDREES TYPING ACADEMY ✦</p><h1>Certificate of Completion</h1><p>This certificate is presented to</p><div class="name" id="name">Loading…</div><p>For completing a typing assessment</p><div class="meta"><div><b id="wpm">—</b>Words per minute</div><div><b id="accuracy">—</b>Accuracy</div><div><b id="language">—</b>Language</div><div><b id="time">—</b>Time</div></div><p>Certificate ID: <strong id="id"></strong></p><p>Issued: <span id="date"></span></p><p>Guest certificate — stored on the device used for the test</p></section><div class="actions"><button class="btn" onclick="window.print()">Print / Save as PDF</button> <a class="btn ghost" href="/">Return to academy</a></div><p id="error"></p></main><script>const id=new URLSearchParams(location.search).get('id');const rows=JSON.parse(localStorage.getItem('ita_guest_results')||'[]');const x=rows.find(r=>r.id===id);if(!x){document.querySelector('#cert').hidden=true;document.querySelector('.actions').hidden=true;document.querySelector('#error').textContent='Certificate not found in this browser. Guest certificates are stored only on the device used for the test.'}else{for(const [k,v] of Object.entries({name:x.name,wpm:x.wpm.toFixed(1),accuracy:x.accuracy.toFixed(1)+'%',language:x.language,time:x.seconds+' seconds',id:x.id,date:new Date(x.date).toLocaleDateString()}))document.getElementById(k).textContent=v}</script></body></html>
