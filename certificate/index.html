<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Typing Certificate | Idrees Typing Academy</title><link rel="stylesheet" href="/theme.css"><style>body{background:#f7f1fa;padding:25px}.wrap{max-width:900px;margin:30px auto;text-align:center}.cert{background:white;padding:50px 30px;border:12px double #9836ad;outline:2px solid #d6ad52;outline-offset:6px}.cert h1{font:40px Georgia,serif;color:#301342}.name{font:italic 32px Georgia,serif;color:#bf3c72;border-bottom:1px solid #ddd;padding:12px}.meta{display:flex;justify-content:center;gap:25px;flex-wrap:wrap;margin:25px}.meta b{display:block;font-size:22px;color:#77318e}.tier{display:inline-block;margin:14px auto;padding:10px 24px;border:2px solid currentColor;border-radius:999px;font-weight:800;letter-spacing:2px;text-transform:uppercase}.diamond{color:#267e9d;background:#eafaff}.gold{color:#9a6b08;background:#fff6d9}.bismuth{color:#7650a0;background:#f2eaff}.silver{color:#65717d;background:#f0f3f6}.bronze{color:#94603d;background:#fff0e5}.muted{color:#70677a;font-size:12px}@media print{body{background:white;padding:0}.wrap{margin:0}.actions{display:none}.tier{print-color-adjust:exact;-webkit-print-color-adjust:exact}}</style></head><body><main class="wrap"><section class="cert" id="cert"><p>✦ IDREES TYPING ACADEMY ✦</p><h1>Certificate of Completion</h1><p>This certificate is presented to</p><div class="name" id="name">Loading…</div><p>For completing a typing assessment</p><div class="tier" id="tier">Achievement Tier</div><div class="meta"><div><b id="wpm">—</b>Words per minute</div><div><b id="accuracy">—</b>Accuracy</div><div><b id="language">—</b>Language</div><div><b id="time">—</b>Time</div></div><p>Certificate ID: <strong id="id"></strong></p><p>Issued: <span id="date"></span></p><p class="muted" id="verification">Certificate record</p></section><div class="actions"><button class="btn" onclick="window.print()">Print / Save as PDF</button> <a class="btn ghost" href="/">Return to academy</a> <a class="btn ghost" id="verifyLink" href="/verify">Verify</a></div><p id="error"></p></main><script>const id=new URLSearchParams(location.search).get('id');const tierClass=t=>(t||'Bronze').toLowerCase();function show(x,verified){for(const [k,v] of Object.entries({name:x.display_name||x.name,wpm:Number(x.wpm).toFixed(1),accuracy:Number(x.accuracy).toFixed(1)+'%',language:x.language,time:(x.duration_seconds||x.seconds||0)+' seconds',id:x.id,date:new Date(x.issued_at||x.date).toLocaleDateString()}))document.getElementById(k).textContent=v;const tier=x.tier||'Bronze';const el=document.getElementById('tier');el.textContent=tier+' Certificate';el.classList.add(tierClass(tier));document.getElementById('verification').textContent=verified?'Publicly verifiable academy certificate':'Guest certificate stored only in this browser';document.getElementById('verifyLink').href='/verify?id='+encodeURIComponent(x.id)}(async()=>{try{const r=await fetch('/api/certificate?id='+encodeURIComponent(id));if(r.ok){const d=await r.json();show(d.certificate,true);return}}catch(e){}const rows=JSON.parse(localStorage.getItem('ita_guest_results')||'[]');const x=rows.find(r=>r.id===id);if(x){show(x,false);return}document.getElementById('cert').hidden=true;document.querySelector('.actions').hidden=true;document.getElementById('error').textContent='Certificate not found. Check the ID or open it in the browser where the guest test was completed.'})()</script></body></html>
