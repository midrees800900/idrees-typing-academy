<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Sign in · Idrees Typing Academy</title><link rel="stylesheet" href="/theme.css"><style>body{min-height:100vh;display:grid;place-items:center;padding:24px}.panel{width:min(100%,460px);background:white;border:1px solid var(--border);border-radius:22px;padding:34px;box-shadow:0 18px 55px #1e4b8512}.mark{width:52px;height:52px;border-radius:16px;background:#e7f0ff;color:#1769e0;display:grid;place-items:center;font-weight:900;font-size:22px}.muted{color:var(--text-dim);line-height:1.7}.google{display:block;width:100%;text-align:center;background:#fff;color:#263746;border:1px solid #d7dce4;border-radius:12px;padding:14px;font-weight:700;margin:22px 0;cursor:pointer}.google:before{content:'G';font:bold 18px Arial;color:#4285f4;margin-right:12px}.note{font-size:12px;color:var(--text-dim);line-height:1.6}button:disabled{opacity:.6;cursor:wait}</style></head><body><main class="panel"><div class="mark">IT</div><h1>Welcome to Idrees Typing Academy</h1><p class="muted">Sign in with Google to save your typing history, receive permanent certificates and appear on the global leaderboard. Guest practice remains free.</p><button class="google" id="google">Continue with Google</button><p class="note" id="status" role="status">Your Google account is used only to create and secure your academy account.</p><p><a href="/">← Continue as a guest</a></p></main><script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
const button=document.querySelector("#google"),status=document.querySelector("#status");
button.addEventListener("click",async()=>{button.disabled=true;status.textContent="Connecting to Google…";try{
 const cr=await fetch("/api/auth/config");const cd=await cr.json();if(!cr.ok||!cd.configured)throw new Error("The academy owner still needs to connect the Firebase account service in Cloudflare.");
 const app=initializeApp(cd.config);const auth=getAuth(app);const result=await signInWithPopup(auth,new GoogleAuthProvider());const idToken=await result.user.getIdToken();
 const r=await fetch("/api/auth/firebase",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({idToken})});const data=await r.json();if(!r.ok)throw new Error(data.error||"Sign-in failed.");
 const next=new URLSearchParams(location.search).get("next")||"/";location.href=next.startsWith("/")&&!next.startsWith("//")?next:"/";
 }catch(e){status.textContent=e.message||"Could not sign in. Please try again.";}finally{button.disabled=false}});
</script></body></html>
