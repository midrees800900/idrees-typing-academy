<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Check whether an Idrees Typing Academy certificate is registered and review its recorded typing result."><meta name="robots" content="noindex,nofollow"><title>Verify Certificate | Idrees Typing Academy</title><link rel="stylesheet" href="/theme.css"></head><body style="min-height:100vh;display:grid;place-items:center;padding:24px"><main style="max-width:650px;background:white;border:1px solid var(--border);border-radius:22px;padding:32px"><div class="logo">IT</div><h1>Certificate verification</h1><div id="status">Checking certificate…</div><p id="details"></p><p id="idline"></p><a class="btn" href="/">Return to academy</a></main><script>const id=new URLSearchParams(location.search).get('id');(async()=>{try{if(id){const r=await fetch('/api/certificate?id='+encodeURIComponent(id));const d=await r.json();if(r.ok&&d.verified){const x=d.certificate;document.querySelector('#status').textContent='✓ VERIFIED — This certificate exists in the Idrees Typing Academy records.';document.querySelector('#details').textContent=x.display_name+' · '+x.language+' · '+Number(x.wpm).toFixed(1)+' WPM · '+Number(x.accuracy).toFixed(1)+'% · '+x.tier+' Certificate';document.querySelector('#idline').textContent='Certificate ID: '+x.id+' · Issued '+new Date(x.issued_at).toLocaleDateString();return}}}catch(e){}const rows=JSON.parse(localStorage.getItem('ita_guest_results')||'[]');const x=rows.find(r=>r.id===id);document.querySelector('#status').textContent=x?'This is a guest result found only in this browser. It is not in the public certificate registry.':'Certificate not found or the public verification service is not configured.';if(x){document.querySelector('#details').textContent=x.name+' · '+x.language+' · '+x.wpm.toFixed(1)+' WPM · '+x.accuracy.toFixed(1)+'% · '+(x.tier||'Bronze');document.querySelector('#idline').textContent='Local certificate ID: '+x.id}})()</script></main></body></html>
