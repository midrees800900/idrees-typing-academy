<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Verify Certificate | Idrees Typing Academy</title><link rel="stylesheet" href="/theme.css"></head><body style="min-height:100vh;display:grid;place-items:center;padding:24px"><main style="max-width:620px;background:white;border:1px solid var(--border);border-radius:22px;padding:32px"><div class="logo">IT</div><h1>Certificate check</h1><div id="status">Checking this device…</div><p id="details"></p><p><small>Guest results are stored in the browser used for the test. This is not public, cross-device verification.</small></p><a class="btn" href="/">Return to academy</a></main><script>const id=new URLSearchParams(location.search).get('id');const rows=JSON.parse(localStorage.getItem('ita_guest_results')||'[]');const x=rows.find(r=>r.id===id);document.querySelector('#status').textContent=x?'A matching guest result was found on this device.':'No matching guest certificate was found in this browser.';if(x)document.querySelector('#details').textContent=x.name+' · '+x.language+' · '+x.wpm.toFixed(1)+' WPM · '+x.accuracy.toFixed(1)+'% · '+x.id;</script></body></html>
